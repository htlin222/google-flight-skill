name: Build & Release Skill

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from SHA
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Package skill
        run: |
          cd google-flight
          zip -r ../google-flight.zip .
          cd ..
          cp google-flight.zip google-flight.skill

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-flight-${{ steps.version.outputs.sha }}
          path: google-flight.skill

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="v0.1.0-${SHORT_SHA}"

          # Pull the commit message into the notes so releases carry a real
          # changelog instead of just version/install boilerplate. Written
          # via redirection (not heredoc variable interpolation) so nothing
          # in the commit message can be reinterpreted by the shell.
          git log -1 --pretty=%B > /tmp/commit-body.txt

          {
            echo "## What changed"
            echo
            cat /tmp/commit-body.txt
            echo
            echo "---"
            echo
            echo "**Version:** \`${SHORT_SHA}\`"
            echo "**Commit:** ${GITHUB_SHA}"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "npx skills add htlin222/google-flight-skill"
            echo '```'
            echo
            echo "Or download the \`.skill\` file from assets below."
          } > release-notes.md

          gh release create "${TAG}" \
            --title "google-flight skill ${TAG}" \
            --notes-file release-notes.md \
            google-flight.skill
